<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atelier du livre</title><style>html,body{height:100%;margin:0;background:#101214;color:#f4f4f4;font:16px system-ui;display:grid;place-items:center}.load{opacity:.78}</style></head><body><div class="load">Chargement de l’Atelier du livre…</div><script>(async()=>{try{const files=["bundle/part-00.txt","bundle/part-01.txt","bundle/part-02.txt","bundle/part-03.txt","bundle/part-04.txt","bundle/part-05.txt","bundle/part-06.txt","bundle/part-07.txt","bundle/part-08.txt","bundle/part-09.txt","bundle/part-10.txt","bundle/part-11.txt","bundle/part-12.txt","bundle/part-13.txt","bundle/part-14.txt","bundle/part-15.txt"];const html=(await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:"no-store"});if(!r.ok)throw new Error(f);return r.text()}))).join("");document.open();document.write(html);document.close()}catch(e){document.body.innerHTML="<p>Impossible de charger l’outil. Recharge la page.</p>";console.error(e)}})();</script></body></html>
